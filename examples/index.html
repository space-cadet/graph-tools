<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@space-cadet/graph-tools Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      padding: 20px 40px;
      border-bottom: 1px solid #1e293b;
    }
    header h1 { font-size: 24px; margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 14px; }
    .container {
      padding: 20px 40px;
      max-width: 1200px;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .demo-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .demo-card h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #fbbf24;
    }
    .graph-container {
      width: 100%;
      height: 350px;
      background: #020617;
      border-radius: 8px;
      position: relative;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #475569;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover { background: #64748b; }
    button.primary { background: #6366f1; }
    button.primary:hover { background: #818cf8; }
    .info {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    .info strong { color: #e2e8f0; }
    @media (max-width: 900px) {
      .demo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>@space-cadet/graph-tools Demo</h1>
    <p>Interactive graph visualization with D3.js force-directed layout</p>
  </header>

  <div class="container">
    <div class="demo-grid">
      <div class="demo-card">
        <h3>D3 Force-Directed Graph</h3>
        <div id="d3-graph" class="graph-container"></div>
        <div class="controls">
          <button onclick="addRandomNode()">Add Node</button>
          <button onclick="randomizeLayout()">Shuffle</button>
          <button class="primary" onclick="toggleFlow()">Toggle Flow</button>
        </div>
        <div class="info">
          <strong>Nodes:</strong> <span id="node-count">0</span> | 
          <strong>Edges:</strong> <span id="edge-count">0</span> | 
          <strong>Selected:</strong> <span id="selected-node">none</span>
        </div>
      </div>

      <div class="demo-card">
        <h3>2D Lattice (5×5)</h3>
        <div id="lattice-graph" class="graph-container"></div>
        <div class="controls">
          <button onclick="createLattice()">Regenerate</button>
          <button class="primary" onclick="highlightRandom()">Highlight</button>
        </div>
        <div class="info">
          <strong>Type:</strong> Planar grid | 
          <strong>Spectral ρ:</strong> <span id="spectral">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="demo.js"></script>
</body>
</html>
